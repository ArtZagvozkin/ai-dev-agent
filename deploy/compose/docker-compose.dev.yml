services:
  ai-dev-agent:
    build:
      context: /opt/ai-dev-agent
      dockerfile: deploy/compose/Dockerfile
    image: artzagvozkin/ai-dev-agent:0.1.0
    volumes:
      - /opt/ai-dev-agent/logs:/app/logs
      - /opt/ai-dev-agent/app:/app/app
      - /opt/packetfence:/opt/packetfence:ro
    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0
      --port 18010
      --reload
