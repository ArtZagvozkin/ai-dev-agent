services:
  ai-dev-agent:
    image: artzagvozkin/ai-dev-agent:0.1.0
    container_name: ai-dev-agent
    restart: unless-stopped
    ports:
      - "18010:18010"
    env_file:
      - /opt/ai-dev-agent/.env
    volumes:
      - /opt/ai-dev-agent/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18010/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: ai-dev-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "15432:5432"
    volumes:
      - /opt/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: ai-dev-agent-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - /opt/data/qdrant:/qdrant/storage
