[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-agent"
version = "0.1.0"
description = "AI development agent MVP"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "requests",
    "requests[socks]",
    "openai",
    "pydantic",
    "qdrant-client",
    "tree-sitter",
    "tree-sitter-language-pack==0.13.0",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "websocket-client>=1.8.0",
    "python-telegram-bot>=21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
